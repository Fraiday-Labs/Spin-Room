# Free Render Blueprint (README → Deploy → Free tier): one free web service runs the API, the
# remote MCP server and the Slack app in one process (apps/server), with a free Key Value
# (Redis). Postgres and avatar storage live on Supabase's free plan; the web app is static on
# Vercel (apps/web/vercel.json), which proxies /v1, Slack and the OAuth paths here.
#
# Free instances sleep after 15 idle minutes: point a free uptime monitor at
# https://<service>.onrender.com/healthz?deep=1 every 5–10 minutes to keep it (and Supabase) awake.
# For separate paid services, use deploy/render-scaled.yaml instead.

services:
  - type: web
    name: spinroom
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: node server/dist/main.js
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: PORT
        value: '10000'
      # The web app's public URL, e.g. https://spinroom-web.vercel.app (OAuth issuer, Spotify
      # redirect base, invite links).
      - key: PUBLIC_ORIGIN
        sync: false
      # Supabase → Connect → Session pooler URI (IPv4), with ?sslmode=require appended.
      - key: DATABASE_URL
        sync: false
      # Supabase's free pooler allows 15 connections; the API takes 8, the rest stay spare.
      - key: DB_POOL_MAX
        value: '8'
      - key: REDIS_URL
        fromService: { type: keyvalue, name: spinroom-kv, property: connectionString }
      - key: SESSION_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: SERVICE_SECRET_MCP
        generateValue: true
      - key: SERVICE_SECRET_SLACK
        generateValue: true
      - key: COOKIE_SECURE
        value: '1'
      - key: MCP_RESOURCE_URL
        value: https://spinroom.onrender.com/mcp
      # Staging smoke test: fake Spotify. Switch to `real` (and remove ALLOW_FAKE_SPOTIFY)
      # once your Spotify app's redirect URI is set to PUBLIC_ORIGIN/v1/auth/spotify/callback.
      - key: SPOTIFY_MODE
        value: fake
      - key: ALLOW_FAKE_SPOTIFY
        value: '1'
      - key: ADMIN_SPOTIFY_IDS
        sync: false
      # Avatars: Supabase Storage over S3 (Storage → Settings → S3 connection). The endpoint is
      # https://<project-ref>.storage.supabase.co/storage/v1/s3 and the region is the project's.
      - key: STORAGE_DRIVER
        value: s3
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_BUCKET
        value: avatars
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      # Slack app credentials (leave empty until you set up Slack).
      - key: SLACK_CLIENT_ID
        sync: false
      - key: SLACK_CLIENT_SECRET
        sync: false
      - key: SLACK_SIGNING_SECRET
        sync: false
      - key: SLACK_STATE_SECRET
        generateValue: true

  - type: keyvalue
    name: spinroom-kv
    plan: free
    # Room state and pub/sub must not be evicted. (Free Key Value doesn't persist to disk; the
    # API rebuilds room state from Postgres after a restart.)
    maxmemoryPolicy: noeviction
    ipAllowList: []
