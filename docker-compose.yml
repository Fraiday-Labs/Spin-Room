# Local Postgres, Redis and S3-compatible storage. `docker compose up -d`
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: spinroom
      POSTGRES_PASSWORD: spinroom
      POSTGRES_DB: spinroom
    ports: ['5432:5432']
    volumes: ['pg:/var/lib/postgresql/data', './scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init.sql:ro']
  redis:
    image: redis:7
    ports: ['6379:6379']
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: spinroom
      MINIO_ROOT_PASSWORD: spinroom-secret
    ports: ['9000:9000', '9001:9001']
    volumes: ['minio:/data']
volumes:
  pg: {}
  minio: {}
