# Single public origin: the SPA plus routes to the API and Slack services.
# Set API_UPSTREAM / SLACK_UPSTREAM hosts for your platform.
map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}
server {
  listen 80;
  root /usr/share/nginx/html;

  location /v1/integrations/slack/ { proxy_pass http://slack:8070; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; }
  location /v1/ {
    proxy_pass http://api:8080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 11m;
  }
  location ~ ^/oauth/(authorize|token|register|revoke)$ { proxy_pass http://api:8080; proxy_set_header Host $host; }
  location = /.well-known/oauth-authorization-server { proxy_pass http://api:8080; proxy_set_header Host $host; }

  location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }
  location /art/ { add_header Cache-Control "public, max-age=86400"; try_files $uri =404; }
  location / { try_files $uri /index.html; }
}
