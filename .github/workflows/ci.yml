name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: spinroom
          POSTGRES_PASSWORD: spinroom
          POSTGRES_DB: spinroom_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U spinroom" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: spinroom
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create per-suite test databases
        run: |
          for db in spinroom_test_mcp spinroom_test_slack spinroom_test_server spinroom_e2e; do
            psql -h localhost -U spinroom -d spinroom_test -c "CREATE DATABASE $db"
          done
      - run: pnpm lint
      - run: pnpm exec prettier --check .
      - run: pnpm typecheck
      - name: Unit, integration and contract tests
        run: pnpm test
      - name: OpenAPI is generated from the contracts
        run: pnpm openapi
      - name: Art builds within budget
        run: pnpm art
      - name: Build apps
        run: pnpm --filter @spinroom/web build && pnpm --filter @spinroom/api build && pnpm --filter spinroom-mcp build && pnpm --filter @spinroom/slack build && pnpm --filter @spinroom/server build
      - name: Bundle budget (300 KB gzipped initial JS)
        run: pnpm size
      - name: Install Playwright Chromium
        run: pnpm --filter @spinroom/web exec playwright install --with-deps chromium
      - name: End-to-end journeys (Playwright, fake Spotify)
        run: pnpm e2e
        env:
          CI: '1'
          PW_BUNDLED: '1'
      - name: End-to-end journeys, free-tier layout (all-in-one server; live socket on another origin, ticket auth)
        run: pnpm e2e
        env:
          CI: '1'
          PW_BUNDLED: '1'
          E2E_SPLIT_ORIGIN: '1'
          E2E_SERVER: all
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
